# repository.
#
# If you *are not* an existing customer, click here to contact us for licensing and pricing details:
# <https://www.appknox.com/free-trial>.
#
# Instructions:
#
# 1. In your repository settings, navigate to 'Secrets' and click on 'New repository secret.' Name the
#    secret APPKNOX_ACCESS_TOKEN and paste your Appknox user token into the value field. If you don't have an Appknox token
#    or need to generate a new one for GitHub, visit the Appknox Platform, go to Account Settings->Developer Settings
#    and create a token labeled GitHub
#
# 2. Refer to the detailed workflow below, make any required adjustments, and then save it to your repository. After the
#    action executes, check the 'Security' tab for results

name: Appknox

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  appknox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      APPKNOX_BUILD_COMMAND: ./gradlew build
      APPKNOX_ARTIFACT_PATH: app/build/outputs/apk/debug/app-debug.apk
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Appknox scan prerequisites
        id: detect
        env:
          APPKNOX_ACCESS_TOKEN: ${{ secrets.APPKNOX_ACCESS_TOKEN }}
        run: |
          module_dir="${APPKNOX_ARTIFACT_PATH%%/build/*}"
          if [ "$module_dir" = "$APPKNOX_ARTIFACT_PATH" ]; then
            module_dir=""
          fi

          if [ -f gradlew ] && [ -n "$module_dir" ] && [ -d "$module_dir" ] && { [ -f "$module_dir/build.gradle" ] || [ -f "$module_dir/build.gradle.kts" ] || [ -f "$module_dir/src/main/AndroidManifest.xml" ]; }; then
            echo "has_mobile_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_mobile_build=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$APPKNOX_ACCESS_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip unsupported Appknox scan
        if: ${{ steps.detect.outputs.has_mobile_build != 'true' || steps.detect.outputs.has_token != 'true' }}
        run: |
          echo "Skipping Appknox scan because this repository does not contain the expected Android build inputs or APPKNOX_ACCESS_TOKEN is not configured."

      - name: Grant execute permission for gradlew
        if: ${{ steps.detect.outputs.has_mobile_build == 'true' && steps.detect.outputs.has_token == 'true' }}
        run: chmod +x gradlew

      - name: Build the app
        if: ${{ steps.detect.outputs.has_mobile_build == 'true' && steps.detect.outputs.has_token == 'true' }}
        run: ${{ env.APPKNOX_BUILD_COMMAND }}                        # Update this Android build command so it produces APPKNOX_ARTIFACT_PATH

      - name: Appknox GitHub action
        id: appknox_scan
        if: ${{ steps.detect.outputs.has_mobile_build == 'true' && steps.detect.outputs.has_token == 'true' }}
        uses: appknox/appknox-github-action@b7d2bfb2321d5544e97bffcba48557234ab953a4
        with:
          appknox_access_token: ${{ secrets.APPKNOX_ACCESS_TOKEN }}
          file_path: ${{ env.APPKNOX_ARTIFACT_PATH }}                # Update this Android artifact path to the APK produced by APPKNOX_BUILD_COMMAND
          risk_threshold: MEDIUM                                      # Update this to desired risk threshold [LOW, MEDIUM, HIGH, CRITICAL]
          sarif: Enable

      - name: Upload SARIF to GHAS
        if: ${{ steps.detect.outputs.has_mobile_build == 'true' && steps.detect.outputs.has_token == 'true' && steps.appknox_scan.outcome == 'success' && hashFiles('report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report.sarif
